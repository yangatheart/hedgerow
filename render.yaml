# Render Blueprint: one web service + one PostgreSQL database.
# In Render: New + -> Blueprint -> connect this repo -> Apply.
services:
  - type: web
    name: hedgerow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hedgerow-db
          property: connectionString

databases:
  - name: hedgerow-db
    plan: free
    databaseName: hedgerow
    user: hedgerow
